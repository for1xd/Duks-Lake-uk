# Тримає src/ (копію коду, розбиту на модулі для Graphify та інших індексаторів) у синхроні з index.html.
name: Sync src modules
on:
  push:
    paths: ['index.html', 'tools/split_src.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 tools/split_src.py
      - name: Commit updated src/
        run: |
          if [ -n "$(git status --porcelain src)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src
            git commit -m "Sync src/ modules from index.html"
            git push
          fi
